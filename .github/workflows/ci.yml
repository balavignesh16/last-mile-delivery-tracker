name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lastmile
          POSTGRES_PASSWORD: lastmile_ci_pw
          POSTGRES_DB: lastmile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastmile -d lastmile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet (unit)
        run: go vet ./...

      - name: go vet (integration)
        run: go vet -tags=integration ./...

      - name: go vet (e2e)
        run: go vet -tags=e2e ./...

      - name: go build
        run: go build ./...

      - name: go test (unit)
        run: go test ./...

      - name: go test (integration)
        env:
          TEST_DATABASE_URL: postgres://lastmile:lastmile_ci_pw@localhost:5432/lastmile?sslmode=disable
        run: go test -tags=integration ./tests/integration/...

      - name: go test (e2e)
        env:
          TEST_DATABASE_URL: postgres://lastmile:lastmile_ci_pw@localhost:5432/lastmile?sslmode=disable
        run: go test -tags=e2e ./tests/e2e/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript
        run: npx tsc -b

      - name: Lint
        run: npx oxlint src

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build
