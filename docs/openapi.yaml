openapi: 3.0.3
info:
  title: Last-Mile Delivery Tracker API
  description: >
    A hand-authored, static OpenAPI document (M12) mirroring docs/api.md
    exactly — every path, method, role restriction, and error code below
    reflects an endpoint that actually exists in backend/internal/*/routes.go.
    Nothing here is generated by runtime reflection, and no endpoint is
    invented: this file only documents the API, it never defines it. M11
    (notifications) has no REST endpoints at all, by design — see the
    note at the bottom of this document.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local development (docker compose up)
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Agents
  - name: Zones
  - name: Rates
  - name: Quote
  - name: Orders
  - name: Tracking
  - name: Assignment
  - name: Rescheduling

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database connectivity check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Public self-registration — always creates a CUSTOMER
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a JWT (24h expiry, HS256)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: The caller's own profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Users]
      summary: Update the caller's own full_name/phone — nothing else is editable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/users/lookup:
    get:
      tags: [Users]
      summary: >-
        Resolve a customer's email to their user id (ADMIN only) — lets an
        admin creating an order on a customer's behalf (POST /orders'
        customer_id) find the id from the only thing they realistically
        know, the customer's email. An email that doesn't exist and one
        that belongs to a non-customer account both return the same 404,
        so this can't be used to probe whether an email belongs to staff.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerLookupResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/agents:
    post:
      tags: [Agents]
      summary: Provision a DELIVERY_AGENT (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                full_name: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Agents]
      summary: List every agent (ADMIN only) — no filters, no pagination
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/agents/me:
    get:
      tags: [Agents]
      summary: The caller's own agent record (DELIVERY_AGENT only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{id}:
    get:
      tags: [Agents]
      summary: Retrieve one agent's detail (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{id}/active:
    put:
      tags: [Agents]
      summary: Activate or deactivate an agent (ADMIN only) — reversible, blocks new assignment eligibility only
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/agents/{id}/availability:
    put:
      tags: [Agents]
      summary: Set AVAILABLE/BUSY/OFFLINE (ADMIN, or DELIVERY_AGENT for their own record only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { type: string, enum: [AVAILABLE, BUSY, OFFLINE] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/agents/{id}/location:
    put:
      tags: [Agents]
      summary: Report current lat/lng (DELIVERY_AGENT only, self-only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/agents/{id}/zone:
    put:
      tags: [Agents]
      summary: Set current_zone_id (DELIVERY_AGENT only, self-only) — the write path assignment.IsEligible requires
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_id]
              properties:
                zone_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/zones:
    post:
      tags: [Zones]
      summary: Create a zone (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Zones]
      summary: List every zone (ADMIN or CUSTOMER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/zones/{id}:
    get:
      tags: [Zones]
      summary: Retrieve one zone (ADMIN or CUSTOMER)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Zones]
      summary: Rename and/or activate/deactivate a zone (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/zones/{zoneID}/areas:
    post:
      tags: [Zones]
      summary: Create an area under a zone (ADMIN only)
      parameters:
        - name: zoneID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Zones]
      summary: List the areas belonging to one zone (ADMIN or CUSTOMER)
      parameters:
        - name: zoneID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Area" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/zones/{zoneID}/areas/{areaID}:
    put:
      tags: [Zones]
      summary: Rename and/or activate/deactivate an area (ADMIN only) — moving it to another zone is not supported
      parameters:
        - name: zoneID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: areaID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/rates:
    post:
      tags: [Rates]
      summary: Create a rate card (ADMIN only) — always starts inactive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_type, zone_relationship]
              properties:
                order_type: { type: string, enum: [B2B, B2C] }
                zone_relationship: { type: string, enum: [INTRA, INTER] }
                cod_surcharge: { type: number, minimum: 0 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Rates]
      summary: List every rate card (ADMIN only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RateCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/rates/{id}:
    get:
      tags: [Rates]
      summary: Retrieve one rate card (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Rates]
      summary: Update cod_surcharge and/or activate/deactivate a rate card (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cod_surcharge]
              properties:
                cod_surcharge: { type: number, minimum: 0 }
                active: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/rates/{rateCardID}/slabs:
    post:
      tags: [Rates]
      summary: Create a weight slab under a rate card (ADMIN only)
      parameters:
        - name: rateCardID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min_weight, price]
              properties:
                min_weight: { type: number, minimum: 0 }
                max_weight: { type: number, nullable: true, description: "Omit for an open-ended top slab (at most one per card)" }
                price: { type: number, minimum: 0 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slab" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Rates]
      summary: List the slabs belonging to one rate card (ADMIN only)
      parameters:
        - name: rateCardID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slab" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/rates/{rateCardID}/slabs/{slabID}:
    put:
      tags: [Rates]
      summary: Update a slab's min_weight/max_weight/price (ADMIN only)
      parameters:
        - name: rateCardID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: slabID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min_weight, price]
              properties:
                min_weight: { type: number }
                max_weight: { type: number, nullable: true }
                price: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slab" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Rates]
      summary: Delete a slab (ADMIN only) — the only configuration entity that may be deleted outright
      parameters:
        - name: rateCardID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: slabID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No Content }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orders/quote:
    post:
      tags: [Quote]
      summary: Calculate a quote (ADMIN or CUSTOMER) — stateless, nothing is persisted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create and price an order (ADMIN or CUSTOMER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/QuoteRequest"
                - type: object
                  properties:
                    customer_id:
                      type: string
                      format: uuid
                      description: Required for an ADMIN caller only; must not be present in a CUSTOMER's request
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Orders]
      summary: List orders — ADMIN sees every order, CUSTOMER only their own, DELIVERY_AGENT only orders assigned to them
      description: >
        M12 adds three optional query parameters, honored for ADMIN only —
        a CUSTOMER or DELIVERY_AGENT supplying them gets their unchanged,
        role-scoped result with the parameters silently ignored.
      parameters:
        - name: status
          in: query
          required: false
          description: ADMIN only. One of the eight recognized order statuses.
          schema:
            type: string
            enum: [CREATED, ASSIGNED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RESCHEDULED]
        - name: zone
          in: query
          required: false
          description: ADMIN only. A zone id — matches orders whose pickup OR drop zone is this zone. An unknown id yields an empty result, not an error.
          schema: { type: string, format: uuid }
        - name: agent
          in: query
          required: false
          description: ADMIN only. A delivery_agents id — matches orders currently assigned to this agent. An unknown id yields an empty result, not an error.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: An invalid status filter value was supplied by an ADMIN caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Retrieve one order — ADMIN any, CUSTOMER own only, DELIVERY_AGENT assigned only (404 on mismatch, never 403)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orders/{id}/status:
    post:
      tags: [Tracking]
      summary: Perform one legal state transition (ADMIN or DELIVERY_AGENT, per-edge authorized)
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ASSIGNED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RESCHEDULED]
                metadata:
                  type: object
                  additionalProperties: true
                  description: Optional, free-form, stored verbatim
      responses:
        "201":
          description: Created (the new tracking event)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not a legal transition from the order's current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/orders/{id}/tracking:
    get:
      tags: [Tracking]
      summary: Full, chronological event history for one order (ADMIN or CUSTOMER, own order only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrackingEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orders/{id}/assign:
    post:
      tags: [Assignment]
      summary: Manually assign one named delivery agent to an order (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The agent is ineligible, or the order isn't in an assignable status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/orders/{id}/auto-assign:
    post:
      tags: [Assignment]
      summary: Automatically select and assign the best-ranked eligible agent (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No eligible agent exists, or the order isn't in an assignable status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orders/{id}/reschedule:
    post:
      tags: [Rescheduling]
      summary: Reschedule a FAILED order for a new delivery date (CUSTOMER own order only, or ADMIN any order)
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_date]
              properties:
                requested_date: { type: string, format: date }
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The order is not currently FAILED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/orders/{id}/reschedules:
    get:
      tags: [Rescheduling]
      summary: Full, chronological reschedule-request history for one order (CUSTOMER own order only, or ADMIN any order)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reschedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, malformed, invalid, or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but the role/ownership check failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No resource at that id (or, for an owned resource, one the caller doesn't own — 404 is used instead of 403 to avoid revealing existence)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: A conflicting resource or state already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Validation failure — bad input shape, out-of-range value, or an unknown/protected field
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [CUSTOMER, DELIVERY_AGENT, ADMIN] }
        created_at: { type: string, format: date-time }

    CustomerLookupResult:
      type: object
      description: >-
        Deliberately narrower than User — no role/phone/created_at, since
        this endpoint only ever returns a customer and only exists to
        hand back the id.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }

    Agent:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        availability: { type: string, enum: [AVAILABLE, BUSY, OFFLINE] }
        current_lat: { type: number, nullable: true }
        current_lng: { type: number, nullable: true }
        current_zone_id: { type: string, format: uuid, nullable: true }
        location_updated_at: { type: string, format: date-time, nullable: true }
        last_assigned_at: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    Zone:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    Area:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        zone_id: { type: string, format: uuid }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    RateCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_type: { type: string, enum: [B2B, B2C] }
        zone_relationship: { type: string, enum: [INTRA, INTER] }
        cod_surcharge: { type: number }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    Slab:
      type: object
      properties:
        id: { type: string, format: uuid }
        rate_card_id: { type: string, format: uuid }
        min_weight: { type: number }
        max_weight: { type: number, nullable: true }
        price: { type: number }
        created_at: { type: string, format: date-time }

    QuoteRequest:
      type: object
      required: [pickup_area_id, drop_area_id, order_type, payment_type, length_cm, breadth_cm, height_cm, actual_weight_kg]
      properties:
        pickup_area_id: { type: string, format: uuid }
        drop_area_id: { type: string, format: uuid }
        order_type: { type: string, enum: [B2B, B2C] }
        payment_type: { type: string, enum: [PREPAID, COD] }
        length_cm: { type: number, exclusiveMinimum: 0 }
        breadth_cm: { type: number, exclusiveMinimum: 0 }
        height_cm: { type: number, exclusiveMinimum: 0 }
        actual_weight_kg: { type: number, exclusiveMinimum: 0 }

    Quote:
      type: object
      properties:
        pickup_area_id: { type: string, format: uuid }
        pickup_zone_id: { type: string, format: uuid }
        drop_area_id: { type: string, format: uuid }
        drop_zone_id: { type: string, format: uuid }
        zone_relationship: { type: string, enum: [INTRA, INTER] }
        order_type: { type: string, enum: [B2B, B2C] }
        payment_type: { type: string, enum: [PREPAID, COD] }
        length_cm: { type: number }
        breadth_cm: { type: number }
        height_cm: { type: number }
        actual_weight_kg: { type: number }
        volumetric_weight_kg: { type: number }
        chargeable_weight_kg: { type: number }
        rate_card_id: { type: string, format: uuid }
        base_rate: { type: number }
        cod_surcharge: { type: number }
        final_amount: { type: number }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        order_type: { type: string, enum: [B2B, B2C] }
        payment_type: { type: string, enum: [PREPAID, COD] }
        pickup_area_id: { type: string, format: uuid }
        drop_area_id: { type: string, format: uuid }
        pickup_zone_id: { type: string, format: uuid }
        drop_zone_id: { type: string, format: uuid }
        zone_relationship: { type: string, enum: [INTRA, INTER] }
        length_cm: { type: number }
        breadth_cm: { type: number }
        height_cm: { type: number }
        actual_weight_kg: { type: number }
        volumetric_weight_kg: { type: number }
        chargeable_weight_kg: { type: number }
        rate_card_id: { type: string, format: uuid }
        base_rate: { type: number }
        cod_surcharge: { type: number }
        final_amount: { type: number }
        assigned_agent_id: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [CREATED, ASSIGNED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RESCHEDULED]
        created_at: { type: string, format: date-time }

    TrackingEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        previous_status:
          type: string
          nullable: true
          enum: [CREATED, ASSIGNED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RESCHEDULED]
        new_status:
          type: string
          enum: [CREATED, ASSIGNED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RESCHEDULED]
        actor_id: { type: string, format: uuid }
        actor_role:
          type: string
          nullable: true
          enum: [CUSTOMER, DELIVERY_AGENT, ADMIN]
          description: >-
            The actor's role at the time of this event. Null only for a
            row written before migration 0015 added this column —
            never backfilled, since there's no way to know a historical
            actor's role after the fact.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at: { type: string, format: date-time }

    Reschedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        requested_by: { type: string, format: uuid }
        requested_by_role:
          type: string
          nullable: true
          enum: [CUSTOMER, DELIVERY_AGENT, ADMIN]
          description: Same null-for-historical-rows caveat as TrackingEvent.actor_role.
        requested_date: { type: string, format: date }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

# --- M11: Notifications ---
# Deliberately no paths above for internal/notifications. The Notification
# Service (M11) reacts internally to eight order-lifecycle events by
# emailing/texting the order's own customer, entirely as a synchronous,
# post-commit side effect of the endpoints already documented above — it
# adds no REST endpoint of its own (no GET /notifications, no per-order
# notification history, no admin notification console). This is a
# deliberate, approved scope decision, not an omission — see
# docs/notifications.md.
